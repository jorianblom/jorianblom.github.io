<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blom Honing</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #fff6e5; /* egale honing/crème tint */
    margin: 0;
    padding: 12px;
    color: #3b2f1e;
    padding-bottom: 100px;
}

.container {
    max-width: 420px;
    margin: 0 auto;
}

.logo {
    max-width: 180px;
    display: block;
    margin: 20px auto 10px;
}

p {
    text-align: center;
    color: #6b5a3c;
    margin: 0 0 14px;
    font-size: 14px;
    line-height: 1.4;
}

.tegel {
    background: #fffdf7;
    padding: 18px;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(120, 80, 20, 0.10);
    border: 1px solid #f1e2b8;
}

h2 {
    font-size: 18px;
    margin: 0 0 14px;
}

label {
    font-weight: 600;
    display: block;
    margin: 10px 0 6px;
    font-size: 14px;
    color: #4a3b22;
}

select {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid #e6d3a3;
    font-size: 16px;
    background-color: #fff8e6;
    margin-bottom: 6px;
}

select:focus {
    outline: none;
    border-color: #d99a1d;
}

.totaal {
    margin-top: 14px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    background: rgba(217,154,29,0.08);
    border-radius: 12px;
}

.betaal {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    font-size: 17px;
    background: linear-gradient(135deg, #f4b400, #d99a1d);
    color: white;
    border: none;
    border-radius: 18px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    box-shadow: 0 6px 14px rgba(217,154,29,0.30);
}

.sticky-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fffdf7;
    border-top: 1px solid #f1e2b8;
    box-shadow: 0 -6px 18px rgba(0,0,0,0.08);
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    z-index: 999;
}

.sticky-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

#stickyText {
    font-size: 13px;
    color: #6b5a3c;
}

#stickyPrijs {
    font-size: 16px;
    font-weight: 700;
    color: #3b2f1e;
}

.sticky-bar button {
    background: linear-gradient(135deg, #f4b400, #d99a1d);
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
}

.sticky-bar button:active {
    transform: scale(0.97);
}

@media (max-width: 480px) {
    body {
        padding: 10px;
        padding-bottom: 100px;
    }

    .tegel {
        padding: 16px;
        border-radius: 18px;
    }

    select {
        padding: 14px;
        font-size: 15px;
    }

    h2 {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" alt="Blom Honing" class="logo">

<p>Kies het aantal potjes honing en betaal eenvoudig met iDEAL/Wero</p>

<div class="tegel">

<h2>Bestelling</h2>

<label>Kleine potjes (250g)</label>
<select id="klein" onchange="bereken()">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
</select>

<label>Grote potjes (450g)</label>
<select id="groot" onchange="bereken()">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
</select>

<div class="totaal" id="totaal"></div>

</div>
</div>

<!-- Sticky checkout bar -->
<div id="stickyBar" class="sticky-bar">
    <div class="sticky-info">
        <div id="stickyText">Geen selectie</div>
        <div id="stickyPrijs">€0,00</div>
    </div>
    <button onclick="betalen()">Betalen</button>
</div>

<script>
const prijsKlein = 5;
const prijsGroot = 8;

const betaalLinks = {
    "k0_g1": "Ut5cPNrkHk2z57JWulnOP4tsB27EM0LK",
    "k0_g2": "voo2rsSQ0QgpvCUwJtQwecbefKVYKQsR",

    "k1_g0": "MLaVpskjevsoYUMVVsTC03SRLcfLEAOn",
    "k1_g1": "mIoeGcQwEAezQtKm1OWvMidUWlpEzCLf",
    "k1_g2": "SPl17qXdCKWVlI486L1Dwzpl7ifChUch",

    "k2_g0": "JSdC2pNgg5h1e8SK4eed709aco0YlPB9",
    "k2_g1": "TWfbnoLYxRQ5WTZc06au6LEnF8dkFB9t",
    "k2_g2": "pHO0LpjBuPunweiyR8FmcDrziCmSdDXB",
};

function bereken() {
    const klein = parseInt(document.getElementById("klein").value);
    const groot = parseInt(document.getElementById("groot").value);

    const totaal = (klein * prijsKlein) + (groot * prijsGroot);

    const stickyBar = document.getElementById("stickyBar");

    if (totaal > 0) {
        stickyBar.style.display = "flex";

        document.getElementById("stickyText").innerText =
            `${klein} klein • ${groot} groot`;

        document.getElementById("stickyPrijs").innerText =
            `€${totaal},00`;

        document.getElementById("totaal").innerText =
            `${klein} klein • ${groot} groot\n€${totaal},00`;

    } else {
        stickyBar.style.display = "none";
        document.getElementById("totaal").innerText = "";
    }
}

function betalen() {
    const klein = parseInt(document.getElementById("klein").value);
    const groot = parseInt(document.getElementById("groot").value);

    if (klein === 0 && groot === 0) {
        alert("Kies minimaal 1 potje.");
        return;
    }

    const key = `k${klein}_g${groot}`;
    const link = betaalLinks[key];

    if (link) {
        window.open("https://www.ing.nl/payreq/m/?trxid=" + link, "_blank");
    } else {
        alert("Nog geen betaallink ingevuld voor deze combinatie.");
    }
}
</script>

</body>
</html>
